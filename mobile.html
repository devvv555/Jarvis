<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <link rel="manifest" href="/manifest.json">
  <title>J.A.R.V.I.S. Mobile</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 33, 56, 0.7);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --text: #f8fafc;
      --muted: #94a3b8;
      --college: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e293b, var(--bg) 80%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      padding-bottom: 90px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      box-shadow: 0 0 16px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .status-badge {
      font-size: 0.7rem;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .voice-card {
      background: var(--card-bg);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .mic-button {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: none;
      color: #fff;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: transform 0.15s ease;
    }

    .mic-button:active {
      transform: scale(0.92);
    }

    .voice-status {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .email-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .email-item {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .email-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .tag-college {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .tag-personal {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .sender {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .subject {
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.3;
    }

    .contacts {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .speak-btn {
      align-self: flex-end;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">J</div>
      <div>
        <h1>J.A.R.V.I.S.</h1>
        <p style="font-size:0.7rem; color:var(--muted);">Mobile Personal Assistant</p>
      </div>
    </div>
    <div class="status-badge">ONLINE 24/7</div>
  </header>

  <!-- Meta Glass Smart Vision & Audio Mode -->
  <div class="voice-card" style="border-color: rgba(56, 189, 248, 0.5);">
    <div style="display:flex; justify-content:space-between; width:100%; align-items:center; margin-bottom:8px;">
      <span style="font-size:0.75rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:1px;">👓 Meta Glass Smart Mode</span>
      <span id="glass-mode-badge" style="font-size:0.65rem; background:rgba(56,189,248,0.2); color:#38bdf8; padding:2px 8px; border-radius:10px;">EARPHONES LINKED</span>
    </div>

    <!-- Live Glass Camera Viewfinder (optional toggle) -->
    <div id="camera-box" style="display:none; width:100%; border-radius:12px; overflow:hidden; position:relative; margin-bottom:10px; border:1px solid var(--accent);">
      <video id="glass-video" autoplay playsinline style="width:100%; height:180px; object-fit:cover; background:#000;"></video>
      <div style="position:absolute; top:8px; left:8px; font-size:0.65rem; background:rgba(0,0,0,0.6); padding:2px 8px; border-radius:4px; color:#38bdf8;">
        LIVE POV CAMERA
      </div>
    </div>

    <div style="display:flex; gap:16px; align-items:center;">
      <button class="mic-button" onclick="toggleAlwaysListening()">🎙️</button>
      <button class="mic-button" style="background:linear-gradient(135deg, #10b981, #059669); font-size:1.4rem;" onclick="toggleCamera()">📷</button>
    </div>
    <div class="voice-status" id="voice-label">Say: "What am I looking at?", "What's overhead?", or "Weather"</div>
  </div>

  <div class="section-title">
    <span>PSGIM & Personal Emails</span>
    <button class="refresh-btn" onclick="loadEmails()">Refresh</button>
  </div>

  <div class="email-list" id="emails-container">
    <div style="text-align:center; padding:30px; color:var(--muted); font-size:0.85rem;">
      Checking mail servers...
    </div>
  </div>

  <script>
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        utter.pitch = 0.95;
        // Try selecting English (UK) voice for Jarvis tone
        const voices = window.speechSynthesis.getVoices();
        const ukVoice = voices.find(v => v.lang.includes('en-GB') || v.name.includes('UK') || v.name.includes('British'));
        if (ukVoice) utter.voice = ukVoice;
        window.speechSynthesis.speak(utter);
      }
    }

    let cameraActive = false;
    let videoStream = null;

    async function toggleCamera() {
      const box = document.getElementById('camera-box');
      const video = document.getElementById('glass-video');
      if (!cameraActive) {
        try {
          videoStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          });
          video.srcObject = videoStream;
          box.style.display = 'block';
          cameraActive = true;
          speakText("Meta Glass visual feeds online, sir. I am observing through your camera.");
        } catch (e) {
          speakText("Camera permission denied, sir.");
        }
      } else {
        if (videoStream) {
          videoStream.getTracks().forEach(t => t.stop());
        }
        box.style.display = 'none';
        cameraActive = false;
        speakText("Meta Glass visual feed disengaged.");
      }
    }

    let recognition = null;
    let isAlwaysListening = false;

    function toggleAlwaysListening() {
      const label = document.getElementById('voice-label');
      const badge = document.getElementById('glass-mode-badge');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        label.textContent = "Speech recognition not supported on this browser.";
        return;
      }

      if (isAlwaysListening) {
        isAlwaysListening = false;
        if (recognition) recognition.stop();
        badge.textContent = "STANDBY";
        badge.style.color = "#94a3b8";
        label.textContent = "Always-listening paused. Tap mic to restart.";
        speakText("Always listening mode paused, sir.");
        return;
      }

      isAlwaysListening = true;
      badge.textContent = "ALWAYS LISTENING 🟢";
      badge.style.color = "#10b981";
      badge.style.background = "rgba(16, 185, 129, 0.2)";
      speakText("Meta Glass always listening engaged, sir. Say Jarvis followed by your order.");

      startContinuousRecognition();
    }

    function startContinuousRecognition() {
      const label = document.getElementById('voice-label');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition || !isAlwaysListening) return;

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        label.textContent = "Earphones live: Listening continuously (Wake word: 'Jarvis')...";
      };

      recognition.onresult = (e) => {
        const lastIdx = e.results.length - 1;
        const text = e.results[lastIdx][0].transcript.trim();
        const lower = text.toLowerCase();

        // Check for wake word or direct commands
        if (lower.includes("jarvis") || lower.includes("weather") || lower.includes("flight") || lower.includes("mail") || lower.includes("strategy")) {
          // Clean wake word
          const cleanCmd = text.replace(/jarvis/gi, "").trim() || text;
          label.textContent = 'Heard: "' + cleanCmd + '"';
          handleCommand(cleanCmd);
        }
      };

      recognition.onerror = (e) => {
        // Silently recover from network or no-speech timeouts
        if (isAlwaysListening && e.error !== 'not-allowed') {
          setTimeout(startContinuousRecognition, 500);
        }
      };

      recognition.onend = () => {
        // Automatically restart to keep listening forever
        if (isAlwaysListening) {
          setTimeout(startContinuousRecognition, 400);
        }
      };

      try {
        recognition.start();
      } catch (err) {
        // Handle active instance edge case
      }
    }

    async function handleCommand(cmd) {
      const lower = cmd.toLowerCase();
      const label = document.getElementById('voice-label');

      if (lower.includes('summary') || lower.includes('summarize') || lower.includes('check mail') || lower.includes('check email') || lower.includes('inbox')) {
        speakText("Scanning and generating a strategic summary of your unread messages, sir.");
        loadEmails(true, true);
        return;
      }

      label.textContent = "Analyzing query...";

      // Attempt to get user GPS latitude/longitude if available
      let userLat = 11.0168;
      let userLon = 76.9558;

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;
        }, () => {});
      }

      // Dual Failover: Cloud first, Laptop local Wi-Fi fallback
      async function fetchWithFailover(endpoint, options = {}) {
        const cloudHost = 'https://jarvis-gpwz.onrender.com';
        const localHost = 'http://192.168.10.14:8088';

        try {
          const res = await fetch(endpoint, options);
          if (res.ok) return res;
          throw new Error('Cloud response not ok');
        } catch (cloudErr) {
          console.warn('Cloud node unreachable, failing over to Local Laptop node...', cloudErr);
          const fallbackUrl = localHost + endpoint;
          return await fetch(fallbackUrl, options);
        }
      }

      try {
        const res = await fetchWithFailover('/api/ask', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({query: cmd, lat: userLat, lon: userLon})
        });
        const data = await res.json();
        label.textContent = data.answer;
        speakText(data.answer);
      } catch (e) {
        const err = "Both cloud and local auxiliary nodes failed to respond, sir.";
        label.textContent = err;
        speakText(err);
      }
    }

    async function loadEmails(shouldSpeak = false, speakFullSummary = false) {
      const container = document.getElementById('emails-container');
      try {
        const cloudHost = 'https://jarvis-gpwz.onrender.com';
        const localHost = 'http://192.168.10.14:8088';
        let res;
        try {
          res = await fetch('/api/emails');
          if (!res.ok) throw new Error();
        } catch (err) {
          res = await fetch(localHost + '/api/emails');
        }
        const data = await res.json();
        const list = data.emails || [];

        if (list.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">No unread emails at this moment, sir.</div>';
          if (shouldSpeak) speakText("You have no new unread emails at this time, sir. Your inbox is clear.");
          return;
        }

        container.innerHTML = '';
        const collegeCount = list.filter(m => m.category === 'college').length;
        const personalCount = list.length - collegeCount;

        list.forEach(m => {
          const isCollege = m.category === 'college';
          const item = document.createElement('div');
          item.className = 'email-item';
          item.innerHTML = `
            <div class="email-header">
              <span class="tag ${isCollege ? 'tag-college' : 'tag-personal'}">${isCollege ? 'PSGIM College' : 'Personal'}</span>
              <button class="speak-btn" onclick="speakText('${m.subject.replace(/'/g, "")}')">🔊 Read</button>
            </div>
            <div class="sender">${m.sender.split('<')[0]}</div>
            <div class="subject">${m.subject}</div>
            ${m.contacts && m.contacts.length ? `<div class="contacts">Contacts: ${m.contacts.slice(0, 2).join(', ')}</div>` : ''}
          `;
          container.appendChild(item);
        });

        if (shouldSpeak && list.length > 0) {
          if (speakFullSummary) {
            let summaryVoice = `Sir, here is your executive email briefing. You have ${list.length} unread messages: ${collegeCount} regarding PSGIM college and ${personalCount} personal. `;
            summaryVoice += `Key priority: The PSG Institute forwarding protocol is active. Most recent alert is from ${list[0].sender.split('<')[0]} regarding ${list[0].subject.replace(/[^a-zA-Z0-9 ]/g, '')}. All systems nominal.`;
            speakText(summaryVoice);
          } else {
            speakText(`Sir, you have ${list.length} unread messages. The latest is from ${list[0].sender.split('<')[0]}, regarding ${list[0].subject}`);
          }
        }
      } catch (e) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#ef4444;">Error fetching emails.</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadEmails();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(()=>{});
      }
    });
  </script>
</body>
</html>
