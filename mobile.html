<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <link rel="manifest" href="/manifest.json">
  <title>J.A.R.V.I.S. Mobile</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 33, 56, 0.7);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --text: #f8fafc;
      --muted: #94a3b8;
      --college: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e293b, var(--bg) 80%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      padding-bottom: 90px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      box-shadow: 0 0 16px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .status-badge {
      font-size: 0.7rem;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .voice-card {
      background: var(--card-bg);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .mic-button {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: none;
      color: #fff;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: transform 0.15s ease;
    }

    .mic-button:active {
      transform: scale(0.92);
    }

    .voice-status {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .email-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .email-item {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .email-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .tag-college {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .tag-personal {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .sender {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .subject {
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.3;
    }

    .contacts {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .speak-btn {
      align-self: flex-end;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">J</div>
      <div>
        <h1>J.A.R.V.I.S.</h1>
        <p style="font-size:0.7rem; color:var(--muted);">Mobile Personal Assistant</p>
      </div>
    </div>
    <div class="status-badge">ONLINE 24/7</div>
  </header>

  <div class="voice-card">
    <button class="mic-button" onclick="startVoice()">🎙️</button>
    <div class="voice-status" id="voice-label">Tap to speak through earphones</div>
  </div>

  <div class="section-title">
    <span>PSGIM & Personal Emails</span>
    <button class="refresh-btn" onclick="loadEmails()">Refresh</button>
  </div>

  <div class="email-list" id="emails-container">
    <div style="text-align:center; padding:30px; color:var(--muted); font-size:0.85rem;">
      Checking mail servers...
    </div>
  </div>

  <script>
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        utter.pitch = 0.95;
        // Try selecting English (UK) voice for Jarvis tone
        const voices = window.speechSynthesis.getVoices();
        const ukVoice = voices.find(v => v.lang.includes('en-GB') || v.name.includes('UK') || v.name.includes('British'));
        if (ukVoice) utter.voice = ukVoice;
        window.speechSynthesis.speak(utter);
      }
    }

    function startVoice() {
      const label = document.getElementById('voice-label');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        label.textContent = "Speech recognition not supported on this browser.";
        return;
      }

      const rec = new SpeechRecognition();
      rec.lang = 'en-US';
      rec.start();
      label.textContent = "Listening to your earphones...";

      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        label.textContent = 'You: "' + text + '"';
        handleCommand(text);
      };

      rec.onerror = () => {
        label.textContent = "Could not hear audio. Tap to try again.";
      };
    }

    function handleCommand(cmd) {
      const lower = cmd.toLowerCase();
      if (lower.includes('email') || lower.includes('check mail')) {
        speakText("Checking your personal and PSGIM college emails right now, sir.");
        loadEmails(true);
      } else {
        speakText("At your service, sir. I have registered your command: " + cmd);
      }
    }

    async function loadEmails(shouldSpeak = false) {
      const container = document.getElementById('emails-container');
      try {
        const res = await fetch('/api/emails');
        const data = await res.json();
        const list = data.emails || [];

        if (list.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">No unread emails at this moment, sir.</div>';
          if (shouldSpeak) speakText("You have no new unread emails at this time, sir.");
          return;
        }

        container.innerHTML = '';
        list.forEach(m => {
          const isCollege = m.category === 'college';
          const item = document.createElement('div');
          item.className = 'email-item';
          item.innerHTML = `
            <div class="email-header">
              <span class="tag ${isCollege ? 'tag-college' : 'tag-personal'}">${isCollege ? 'PSGIM College' : 'Personal'}</span>
              <button class="speak-btn" onclick="speakText('${m.subject.replace(/'/g, "")}')">🔊 Read</button>
            </div>
            <div class="sender">${m.sender.split('<')[0]}</div>
            <div class="subject">${m.subject}</div>
            ${m.contacts && m.contacts.length ? `<div class="contacts">Contacts: ${m.contacts.slice(0, 2).join(', ')}</div>` : ''}
          `;
          container.appendChild(item);
        });

        if (shouldSpeak && list.length > 0) {
          speakText(`Sir, you have ${list.length} unread messages. The latest is from ${list[0].sender.split('<')[0]}, regarding ${list[0].subject}`);
        }
      } catch (e) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#ef4444;">Error fetching emails.</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadEmails();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(()=>{});
      }
    });
  </script>
</body>
</html>
